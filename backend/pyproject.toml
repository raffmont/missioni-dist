[project]
name = "missioni-dist-backend"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12", "uvicorn[standard]==0.34.2", "sqlalchemy==2.0.40",
  "alembic==1.15.2", "psycopg[binary]==3.2.6", "pydantic-settings==2.16.2",
  "argon2-cffi==25.1.0", "python-docx==1.1.2", "reportlab==4.4.0",
  "pypdf==5.4.0", "email-validator==2.2.0", "weasyprint==70.0",
  "boto3==1.35.99", "openpyxl==3.1.5", "pillow==13.0.0"
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.8", "mypy==1.15.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.setuptools]
packages = ["app"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101", "B008"]
